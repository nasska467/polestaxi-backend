syntax = "proto3";

package polestaxi.analytic.v1;

option csharp_namespace = "PolesTaxi.Contracts.Analytic.V1";

import "google/api/annotations.proto";

service AnalyticService {
  rpc GetOrderStats(StatsRequest) returns (OrderStatsResponse) {
    option (google.api.http) = { get: "/v1/analytics/orders" };
  }
  rpc GetRatingStats(StatsRequest) returns (RatingStatsResponse) {
    option (google.api.http) = { get: "/v1/analytics/ratings" };
  }
}

message StatsRequest {
  string from = 1;
  string to = 2;
}

message OrderStatsResponse {
  int64 total = 1;
  int64 completed = 2;
  int64 cancelled = 3;
  double avg_price = 4;
  double avg_distance = 5;
}

message RatingStatsResponse {
  int64 total = 1;
  double avg_driver_rating = 2;
  double avg_user_rating = 3;
}