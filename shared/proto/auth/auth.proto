syntax = "proto3";

package polestaxi.auth.v1;

option csharp_namespace = "PolesTaxi.Contracts.Auth.V1";

import "google/api/annotations.proto";

service AuthService {
  rpc Login(LoginRequest) returns (TokenResponse) {
    option (google.api.http) = { post: "/v1/auth/login" body: "*" };
  }
  rpc Refresh(RefreshRequest) returns (TokenResponse) {
    option (google.api.http) = { post: "/v1/auth/refresh" body: "*" };
  }
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = { post: "/v1/auth/logout" body: "*" };
  }
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
}

message LoginRequest {
  string login = 1;
  string password = 2;
}

message RefreshRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  string access_token = 1;
  string refresh_token = 2;
}

message TokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int32 access_expires_in_seconds = 3;
  int32 refresh_expires_in_seconds = 4;
}

message LogoutResponse {
  bool success = 1;
}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  repeated string roles = 3;
}