global:
  scrape_interval: 10s

scrape_configs:
  - job_name: polestaxi
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:8080
          - user:8081
          - auth:8082
          - driver:8083
          - order:8084
          - wallet:8085
          - analytic:8086
