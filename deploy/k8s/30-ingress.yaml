apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: polestaxi-ingress
  namespace: polestaxi
spec:
  rules:
    - http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
