apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: polestaxi
spec:
  replicas: 1
  selector: { matchLabels: { app: user } }
  template:
    metadata: { labels: { app: user } }
    spec:
      containers:
        - name: user
          image: deploy-user:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: polestaxi-config }
            - secretRef: { name: polestaxi-secret }
          ports: [{ containerPort: 8081 }, { containerPort: 9081 }]
          livenessProbe: { httpGet: { path: /healthz, port: 8081 }, initialDelaySeconds: 10, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /readyz, port: 8081 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "384Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: polestaxi
spec:
  selector: { app: user }
  ports:
    - { name: http, port: 8081, targetPort: 8081 }
    - { name: grpc, port: 9081, targetPort: 9081 }
---
